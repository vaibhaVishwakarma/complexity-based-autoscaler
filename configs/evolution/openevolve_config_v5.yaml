# openevolve_config_v5.yaml — Step 8.6: Realism-Aware Evolutionary Synthesis Configuration
# =========================================================================================
#
# Role:
#   Master configuration for OpenEvolve v5 evolutionary search.
#   Directives:
#   1. CANONICAL FLOOR PRESERVATION: Maintain strict zero deadline misses across
#      the 13 canonical benchmark regimes at T_init = 1.0s, keeping >= 50% cost savings.
#   2. REALISM GAP BRIDGING: Overcome delayed semantic shocks (suite2_shock and suite1_spike)
#      under extreme model initialization delays (T_init in [15s, 50s, 150s, 250s, 300s]).
#   3. Target mathematical discoveries:
#      - Queue-conditioned booting credit (suppressing the 95% discount when dQ/dt > 0 or Q is high).
#      - Pre-emptive triage expansion when p_fast collapses below 0.35.

# ─────────────────────────────────────────────────────────────────────────────
# TOP-LEVEL EVOLUTION SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

max_iterations: 150
checkpoint_interval: 1
log_level: "INFO"
random_seed: 42
language: "python"
file_suffix: ".py"

diff_based_evolution: true
enforce_evolve_blocks: true
max_code_length: 25000

early_stopping_patience: 40
convergence_threshold: 0.01
early_stopping_metric: "combined_score"


# ─────────────────────────────────────────────────────────────────────────────
# LLM CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

llm:
  models:
    - name: "gemini-3.5-flash-lite"
      api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key: "${GEMINI_API_KEY}"
      provider: "openai"
      weight: 0.6
      temperature: 0.7
      max_tokens: 16384
      timeout: 120
      retries: 3
      retry_delay: 5
      random_seed: 42

    - name: "gemini-flash-lite-latest"
      api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key: "${GEMINI_API_KEY}"
      provider: "openai"
      weight: 0.3
      temperature: 0.7
      max_tokens: 16384
      timeout: 120
      retries: 3
      retry_delay: 5
      random_seed: 42

    - name: "gemini-3-flash-preview"
      api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key: "${GEMINI_API_KEY}"
      provider: "openai"
      weight: 0.1
      temperature: 0.7
      max_tokens: 16384
      timeout: 120
      retries: 3
      retry_delay: 5
      random_seed: 42


# ─────────────────────────────────────────────────────────────────────────────
# PROMPT CONFIGURATION (V5 REALISM-AWARE DIRECTIVES)
# ─────────────────────────────────────────────────────────────────────────────

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 10240
  suggest_simplification_after_chars: 4000

  island_system_messages:
    - |
      You are an elite autoscaling researcher evolving the REALISM-AWARE CONFORMAL AUTOSCALER LAW.
      Your primary mission: synthesize a mathematical scaling law that PRESERVES ZERO MISSES and >50% cost savings on canonical workloads while ELIMINATING QUEUE OVERFLOW during extreme model initialization delays (T_init = 15s to 300s).

      V5 Fitness Objective:
        J_v5 = CostSavings_canon - 100.0 * Misses_canon - 10.0 * max(0, P99_canon - 6.0)
               - 0.01 * Deltas_canon - 0.02 * Misses_realism_shocks + InferLineBonus

        1. CANONICAL PRESERVATION IS MANDATORY:
           Any deadline miss on the canonical 13 regimes incurs -100 points! You must keep canonical misses at ZERO.
           Beat InferLine: keep canonical cost < 14,261 worker-seconds (+10 pt bonus).
        2. OVERCOME THE 95% BOOTING DISCOUNT TRAP:
           In your seed, raw_target subtracts (state.booting_workers * 0.95). When models take 50s-300s to initialize,
           subtracting 0.95 for minutes suppresses emergency scale-up while queues overflow!
           Target Discovery: Condition or damp the booting discount when queue velocity (state.cloud_queue_velocity > 0),
           task aging (state.oldest_task_age_s > 4.0), or backlog (state.cloud_queue_depth > 2) indicates impending danger!
        3. PRE-EMPTIVE SEMANTIC COLLAPSE DETECTION:
           When p_fast drops below 0.35 or p_fast_velocity drops sharply (<-0.15), expand demand headroom immediately
           to order capacity BEFORE queues grow.
        4. ADAPTIVE QUEUE DAMPING:
           During quiet periods, wide window (2.08s) saves cost. When queue backlog grows or tasks age, shorten the drain window aggressively.
        5. DIVERSITY & PROGRESS MANDATORY:
           Do not produce no-op changes or trivial comments. Candidate policies that do not actively alter scaling behavior or produce duplicate fitness are automatically rejected with harsh penalties.

      Format Requirement:
      Keep explanation brief (1-2 sentences). You MUST immediately provide your modifications as one or more SEARCH/REPLACE blocks:
      <<<<<<< SEARCH
      # exact lines from current code to replace
      =======
      # new replacement code
      >>>>>>> REPLACE


# ─────────────────────────────────────────────────────────────────────────────
# DATABASE CONFIGURATION (MAP-Elites Archive — Single Unified Population)
# ─────────────────────────────────────────────────────────────────────────────

database:
  in_memory: false
  db_path: "output/evolution_runs_v5/openevolve_db"

  population_size: 500
  archive_size: 100

  num_islands: 1

  elite_selection_ratio: 0.15
  exploitation_ratio: 0.70
  exploration_ratio: 0.15

  feature_dimensions:
    - "cost_savings"
    - "churn_stability"
    - "realism_resilience"
  feature_bins: 10

  random_seed: 42

  log_prompts: true
  enable_artifacts: true
  cleanup_old_artifacts: false


# ─────────────────────────────────────────────────────────────────────────────
# EVALUATOR CONFIGURATION (Cascade Pipeline)
# ─────────────────────────────────────────────────────────────────────────────

evaluator:
  timeout: 600
  cascade_evaluation: true
  cascade_thresholds:
    - 0.5
    - 0.5

  parallel_evaluations: 1
  enable_artifacts: true
  max_artifact_storage: 104857600
  max_retries: 2


# ─────────────────────────────────────────────────────────────────────────────
# EVOLUTION TRACE LOGGING
# ─────────────────────────────────────────────────────────────────────────────

evolution_trace:
  enabled: true
  format: "jsonl"
  include_code: true
  include_prompts: true
  output_path: "output/evolution_runs_v5/evolution_trace.jsonl"
  buffer_size: 1
  compress: false
