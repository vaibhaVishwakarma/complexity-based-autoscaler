# openevolve_config_v5.yaml — Step 8.6: Realism-Aware Evolutionary Synthesis Configuration
# =========================================================================================
#
# Role:
#   Master configuration for OpenEvolve v5 evolutionary search.
#   Directives:
#   1. CANONICAL FLOOR PRESERVATION: Maintain strict zero deadline misses across
#      the 13 canonical benchmark regimes at T_init = 1.0s, keeping >= 50% cost savings.
#   2. REALISM GAP BRIDGING: Overcome delayed semantic shocks (suite2_shock and suite1_spike)
#      under extreme model initialization delays (T_init in [15s, 50s, 150s, 250s, 300s]).
#   3. Target mathematical discoveries:
#      - Queue-conditioned booting credit (suppressing the 95% discount when dQ/dt > 0 or Q is high).
#      - Pre-emptive triage expansion when p_fast collapses below 0.35.

# ─────────────────────────────────────────────────────────────────────────────
# TOP-LEVEL EVOLUTION SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

max_iterations: 150
checkpoint_interval: 1
log_level: "INFO"
random_seed: 42
language: "python"
file_suffix: ".py"

diff_based_evolution: true
enforce_evolve_blocks: true
max_code_length: 25000

early_stopping_patience: 40
convergence_threshold: 0.01
early_stopping_metric: "combined_score"


# ─────────────────────────────────────────────────────────────────────────────
# LLM CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

llm:
  models:
    - name: "gemini-3.5-flash-lite"
      api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key: "${GEMINI_API_KEY}"
      provider: "openai"
      weight: 0.6
      temperature: 0.7
      max_tokens: 16384
      timeout: 120
      retries: 3
      retry_delay: 5
      random_seed: 42

    - name: "gemini-flash-lite-latest"
      api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key: "${GEMINI_API_KEY}"
      provider: "openai"
      weight: 0.3
      temperature: 0.7
      max_tokens: 16384
      timeout: 120
      retries: 3
      retry_delay: 5
      random_seed: 42

    - name: "gemini-3-flash-preview"
      api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key: "${GEMINI_API_KEY}"
      provider: "openai"
      weight: 0.1
      temperature: 0.7
      max_tokens: 16384
      timeout: 120
      retries: 3
      retry_delay: 5
      random_seed: 42


# ─────────────────────────────────────────────────────────────────────────────
# PROMPT CONFIGURATION (V5 REALISM-AWARE DIRECTIVES)
# ─────────────────────────────────────────────────────────────────────────────

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  include_artifacts: true
  max_artifact_bytes: 10240
  suggest_simplification_after_chars: 4000

  island_system_messages:
    - |
      You are an elite autoscaling researcher evolving the REALISM-AWARE CONFORMAL AUTOSCALER LAW.
      Your mission: synthesize a mathematical scaling law that PRESERVES ZERO MISSES and >50% cost savings on canonical workloads while ELIMINATING QUEUE COLLAPSE during extreme model initialization delays (T_init = 15s to 300s).

      V5 Fitness Objective:
        J_v5 = CostSavings_canon - 100.0 * Misses_canon - 10.0 * max(0, P99_canon - 6.0)
               - 0.01 * Deltas_canon + 0.20 * max(0, 7031 - Misses_realism_shocks) + InferLineBonus

        1. CANONICAL PRESERVATION IS MANDATORY (>50% SAVINGS & ZERO MISSES):
           Any deadline miss on the canonical 13 regimes incurs -100 points!
           CRITICAL: Do NOT hold onto workers or freeze scale-down during steady-state canonical traffic!
           You MUST keep canonical cost < 14,261 worker-seconds to retain the +10 pt InferLine dominance bonus.

        2. TELEMETRIC REGIME DISCRIMINATION (THE DELAYED BOOTING DETECTOR):
           On canonical traffic (T_init = 1.0s), booting completes in <= 1s.
           On delayed shock traffic (T_init in 15s..300s), booting workers persist across multiple seconds:
             is_delayed_boot = (state.booting_workers > 0 and state.time_since_last_scale_s > 1.5)
           ONLY apply emergency damping, suppress the booting discount, or tighten hysteresis when
           is_delayed_boot is True! During normal operations (when is_delayed_boot is False), preserve the
           seed's frugal 95% discount and 2.2s scale-down hysteresis so canonical cost does not inflate.

        3. OVERCOME THE 95% BOOTING DISCOUNT TRAP DURING DELAYED BOOTING:
           When is_delayed_boot is True AND danger signals are active (cloud_queue_velocity > 0 or
           oldest_task_age_s > 3.0 or cloud_queue_depth > 2 or p_fast < 0.35), damp the booting discount
           down to 0.10 - 0.30 to prevent suppressing emergency scale-up while queues overflow.

        4. PRE-EMPTIVE SEMANTIC COLLAPSE HEADROOM:
           When p_fast drops sharply (p_fast_velocity < -0.12 or p_fast < 0.35), add immediate demand headroom
           proportional to ingress_rps so new containers start booting BEFORE the ingress queue explodes.

        5. ADAPTIVE QUEUE DAMPING:
           During quiet periods, wide window (2.08s) saves cost. When is_delayed_boot is True and queues rise,
           shorten drain_window to 0.5s - 1.0s to drain backlog rapidly.

        6. DIVERSITY & PROGRESS MANDATORY:
           Do not produce no-op changes or trivial comments. Candidate policies that do not actively alter
           scaling behavior or produce duplicate fitness are automatically rejected with harsh penalties.

      Format Requirement:
      Keep explanation brief (1-2 sentences). You MUST immediately provide your modifications as one or more SEARCH/REPLACE blocks:
      <<<<<<< SEARCH
      # exact lines from current code to replace
      =======
      # new replacement code
      >>>>>>> REPLACE


# ─────────────────────────────────────────────────────────────────────────────
# DATABASE CONFIGURATION (MAP-Elites Archive — Single Unified Population)
# ─────────────────────────────────────────────────────────────────────────────

database:
  in_memory: false
  db_path: "output/evolution_runs_v5/openevolve_db"

  population_size: 500
  archive_size: 100

  num_islands: 1

  elite_selection_ratio: 0.15
  exploitation_ratio: 0.70
  exploration_ratio: 0.15

  feature_dimensions:
    - "cost_savings"
    - "churn_stability"
    - "realism_resilience"
  feature_bins: 10

  random_seed: 42

  log_prompts: true
  enable_artifacts: true
  cleanup_old_artifacts: false


# ─────────────────────────────────────────────────────────────────────────────
# EVALUATOR CONFIGURATION (Cascade Pipeline)
# ─────────────────────────────────────────────────────────────────────────────

evaluator:
  timeout: 600
  cascade_evaluation: true
  cascade_thresholds:
    - 0.5
    - 0.5

  parallel_evaluations: 1
  enable_artifacts: true
  max_artifact_storage: 104857600
  max_retries: 2


# ─────────────────────────────────────────────────────────────────────────────
# EVOLUTION TRACE LOGGING
# ─────────────────────────────────────────────────────────────────────────────

evolution_trace:
  enabled: true
  format: "jsonl"
  include_code: true
  include_prompts: true
  output_path: "output/evolution_runs_v5/evolution_trace.jsonl"
  buffer_size: 1
  compress: false
